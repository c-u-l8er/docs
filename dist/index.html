<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampersand Box — stack documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0A0E14; --ink2:#0C111A; --panel:#10151F; --panel2:#0D1320; --line:#1E2632; --line2:#28303E;
  --text:#C6D2E1; --read:#D7DEEA; --dim:#727E92; --faint:#4C5566;
  --accent:#5CC8E8; --accentdim:#3a8aa3;
  --live:#46D08A; --alpha:#5CC8E8; --spec:#F2B24C; --draft:#9B8CF0; --veto:#FF5C7A;
  --disp:'Space Grotesk',system-ui,sans-serif; --read-f:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--disp);line-height:1.55;
  background-image:radial-gradient(1100px 500px at 80% -10%, rgba(92,200,232,.05), transparent 60%);}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:.08em .38em;color:#bfe7f3}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:14px 0}
pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6;color:var(--text)}
blockquote{margin:16px 0;padding:12px 16px;border-left:2px solid var(--accentdim);background:linear-gradient(90deg,rgba(92,200,232,.06),transparent);
  border-radius:0 8px 8px 0;color:var(--read);font-family:var(--read-f);font-size:16.5px;font-style:italic}

/* ───────── top bar ───────── */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:rgba(10,14,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .mk{font:700 14px var(--mono);letter-spacing:.14em;color:var(--accent);cursor:pointer;white-space:nowrap}
.bar .mk b{color:var(--text)}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  font:13px var(--mono);padding:9px 12px 9px 30px}
.search input:focus{outline:2px solid var(--accentdim);outline-offset:0}
.search::before{content:'⌕';position:absolute;left:10px;top:7px;color:var(--dim);font-size:15px}
.results{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto}
.results a{display:block;padding:10px 13px;border-bottom:1px solid var(--line);color:var(--text)}
.results a:hover{background:var(--panel2);text-decoration:none}
.results .rn{font:600 13px var(--disp)} .results .rt{color:var(--dim);font-size:12px;font-family:var(--read-f)}
.chip{font:600 11px var(--mono);letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.chip b{color:var(--live)}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

/* ───────── home: the floor ───────── */
.hero{padding:46px 0 8px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.hero h1{font:600 clamp(30px,6vw,52px)/1.04 var(--disp);letter-spacing:-.022em;margin:.32em 0 .2em}
.hero p{color:var(--dim);max-width:64ch;font-family:var(--read-f);font-size:18px;line-height:1.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0 6px;font:600 11px var(--mono);color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%}
.d-live{background:var(--live)} .d-alpha{background:var(--alpha)} .d-spec{background:var(--spec)} .d-draft{background:var(--draft)}

.floor{margin:14px 0 10px}
.band{margin:22px 0}
.band-h{font:600 11px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin:0 0 10px;
  display:flex;align-items:center;gap:10px}
.band-h::after{content:'';flex:1;height:1px;background:var(--line)}
.rooms{display:grid;gap:10px}
.b-protocol .rooms{grid-template-columns:repeat(3,1fr)}
.b-faculty .rooms{grid-template-columns:repeat(3,1fr)}
.b-provider .rooms{grid-template-columns:repeat(2,1fr)}
.b-substrate .rooms{grid-template-columns:repeat(2,1fr)}
.b-annex .rooms{grid-template-columns:repeat(4,1fr)}
.room{display:block;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 15px 14px;cursor:pointer;transition:transform .12s ease,border-color .2s,background .2s;overflow:hidden;color:var(--text)}
.room:hover{transform:translateY(-3px);border-color:var(--line2);text-decoration:none;background:var(--panel2)}
.room::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--draft)}
.room.s-live::before{background:var(--live)} .room.s-alpha::before{background:var(--alpha)}
.room.s-spec::before{background:var(--spec)} .room.s-draft::before{background:var(--draft)}
.room .rk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.room .mark{font-size:20px;line-height:1;color:var(--text)}
.room .st{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line2)}
.st.s-live{color:var(--live)} .st.s-alpha{color:var(--alpha)} .st.s-spec{color:var(--spec)} .st.s-draft{color:var(--draft)}
.room .rn{font:600 16px var(--disp);margin:9px 0 2px;letter-spacing:-.01em}
.room .ro{font:500 10.5px var(--mono);color:var(--faint);letter-spacing:.04em}
.room .rt{color:var(--dim);font-size:12.5px;font-family:var(--read-f);line-height:1.4;margin-top:7px}
.b-annex .room .rt{display:none}
.b-annex .room{padding:13px}
.b-annex .room .rn{font-size:14px;margin-top:7px}

/* ring 0 foundation slab */
.ring0{margin:18px 0 40px}
.slab{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;background:
  linear-gradient(180deg,rgba(70,208,138,.07),var(--panel));border:1px solid var(--line2);border-radius:14px;padding:18px 20px;position:relative}
.slab::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--live);border-radius:14px 0 0 14px}
.slab .mark{font-size:26px}
.slab .meta{flex:1;min-width:200px}
.slab .rn{font:700 19px var(--disp)} .slab .ro{font:600 10px var(--mono);letter-spacing:.14em;color:var(--live);text-transform:uppercase}
.slab .rt{color:var(--dim);font-family:var(--read-f);font-size:14.5px;margin-top:3px}
.slab a.go{font:600 12px var(--mono);color:var(--ink);background:var(--live);padding:9px 15px;border-radius:8px}
.slab a.go:hover{text-decoration:none;opacity:.9}

/* ───────── doc page ───────── */
.doc{display:grid;grid-template-columns:212px minmax(0,1fr) 232px;gap:34px;padding:30px 0 80px;align-items:start}
.rail{position:sticky;top:74px;font-size:13px}
.rail .rh{font:600 10px var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:0 0 10px}
.nav a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;color:var(--dim);font:500 12.5px var(--disp);margin:1px 0}
.nav a:hover{background:var(--panel);color:var(--text);text-decoration:none}
.nav a.on{background:var(--panel2);color:var(--accent)}
.nav a .nm{font-family:var(--mono);width:16px;text-align:center;color:var(--faint)}
.nav a.on .nm{color:var(--accent)}
.nav .gh{font:600 10px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin:16px 0 6px;padding:0 8px}

.read{min-width:0}
.crumbs{font:600 11px var(--mono);letter-spacing:.06em;color:var(--dim);margin-bottom:6px}
.crumbs a{color:var(--dim)} .crumbs .sep{color:var(--faint);margin:0 7px}
.read h1,.read h2,.read h3,.read h4{font-family:var(--disp);letter-spacing:-.01em;color:var(--text);scroll-margin-top:80px}
.read h1{font-size:clamp(27px,4.4vw,38px);font-weight:600;margin:.1em 0 .15em}
.read h2{font-size:20px;font-weight:600;margin:1.7em 0 .4em;padding-top:.3em}
.read h3{font-size:16px;font-weight:600;margin:1.4em 0 .3em;color:var(--read)}
.read p{font-family:var(--read-f);font-size:17px;line-height:1.66;color:var(--read);margin:.7em 0}
.read ul{margin:.6em 0;padding-left:0;list-style:none}
.read li{font-family:var(--read-f);font-size:16.5px;line-height:1.5;color:var(--read);padding:5px 0 5px 20px;position:relative;border-bottom:1px solid var(--line)}
.read li::before{content:'▸';position:absolute;left:0;color:var(--accentdim);font-size:12px;top:8px}
.read li p{margin:0;font-size:16.5px}
.read a[data-link]{color:var(--accent);border-bottom:1px dotted var(--accentdim)}
.read a[data-link]:hover{text-decoration:none;border-bottom-style:solid}

/* typed-edge neighborhood rail — the graph made visible */
.edges .rh{margin-top:0}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:12px}
.ecard .et{font:600 10px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:9px}
.edge{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.edge:first-of-type{border-top:0}
.edge .pred{font:600 10px var(--mono);color:var(--accent);background:rgba(92,200,232,.09);border:1px solid var(--line2);
  border-radius:999px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.edge .pred.in{color:var(--draft);background:rgba(155,140,240,.09)}
.edge a,.edge span{font:500 12.5px var(--disp);color:var(--text)}
.cidbox{font:10.5px var(--mono);color:var(--faint);word-break:break-all;line-height:1.5}
.cidbox .lab{color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:3px}
.metaline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 18px}
.metaline .st{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line2)}
.metaline .os{font:600 11px var(--mono);color:var(--dim);letter-spacing:.05em}

.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--dim);font-size:13px}
.foot .mono{font-family:var(--mono);font-size:12px;color:var(--faint)}

@media (max-width:920px){
  .doc{grid-template-columns:1fr;gap:20px}
  .rail{position:static;display:none}
  .rail.edges{display:block}
  .b-protocol .rooms,.b-faculty .rooms{grid-template-columns:1fr 1fr}
  .b-provider .rooms,.b-substrate .rooms{grid-template-columns:1fr}
  .b-annex .rooms{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script id="model" type="application/json">{"brand":"Ampersand Box","author":"Travis Burandt","facts":{"laws.count":"120","laws.core":"103","laws.compose":"17","laws.trials":"2000","primitives.count":"six","rungs.count":"eight","kernel.version":"0.10.0","graphonomous.version":"0.4.3","bendscript.version":"0.1.0-alpha.0","runefort.version":"0.1.0-alpha.1","wrl.version":"0.1.2","traaviis.version":"0.1.0"},"docs":[{"id":"box-and-box","name":"box-and-box","mark":"▣","os":"OS-006 · kernel","status":"live","layer":"ring0","tagline":"The governance kernel. Models generate answers; kernels govern them.","cid":"bagaaieraf56yq22nbegh5aprrzkjbb4hozq75el2ivdelep3t6avcl4y76wa","html":"\u003ch2 id=\"blk-1\">box-and-box\u003c/h2>\n\u003cp>The governance kernel for agent actions. It is \u003cstrong>ring 0\u003c/strong>: every proposed action passes through its bridge before it runs, and it returns a \u003cstrong>certificate\u003c/strong> — a reason — not a boolean. It ships as a zero-dependency npm package, version \u003ccode>0.10.0\u003c/code>, and runs deterministically with no model and no network.\u003c/p>\n\u003cblockquote>\u003cp>We don’t replace your policy engine. We contain it.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"blk-5\">The bridge\u003c/h3>\n\u003cp>Almost every agent stack computes desirability first and treats safety as a filter afterward — it asks \u003cstrong>best?\u003c/strong> before \u003cstrong>permitted?\u003c/strong>. The bridge runs the order a kernel must: \u003cstrong>feasible ▸ permitted ▸ best\u003c/strong>. A vetoed option doesn’t get penalized; it is \u003cstrong>annihilated\u003c/strong>. Because 0̲ × anything = 0̲, no utility, however large, can outrank a forbidden action.\u003c/p>\n\u003cp>This single algebraic law is what makes governance composable and un-relaxable. It is the property the conformance suite checks most heavily — see \u003ca href=\"#/laws\" data-link>the laws\u003c/a>.\u003c/p>\n\u003ch3 id=\"blk-8\">The eight rungs\u003c/h3>\n\u003cp>The kernel decomposes governance the way an OS decomposes the machine. Each rung is a small algebra owning exactly one question; the bridge composes them in a precedence that can’t be reordered at runtime.\u003c/p>\n\u003cul>\u003cli>\u003cp>alethic — can it happen? (feasibility floor; below it, 0̲)\u003c/p>\u003c/li>\u003cli>\u003cp>deontic — is it allowed? (obligations, prohibitions, contrary-to-duty repair)\u003c/p>\u003c/li>\u003cli>\u003cp>axiological — which is best? (a semiring, so preferences never resurrect a veto)\u003c/p>\u003c/li>\u003cli>\u003cp>temporal — safe over time? (safety as a trajectory shield; liveness as a horizon duty)\u003c/p>\u003c/li>\u003cli>\u003cp>resource — can we afford it? (a closed, double-entry economy that even prices deliberation)\u003c/p>\u003c/li>\u003cli>\u003cp>epistemic — do we know enough? (a known-unknown routes to deliberation, not a guess)\u003c/p>\u003c/li>\u003cli>\u003cp>strategic — who can ensure it? (coalition ability; ought-implies-can, enforced)\u003c/p>\u003c/li>\u003cli>\u003cp>reflexive — may the rules change? (self-amendment that can never weaken the entrenched core)\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-27\">Install\u003c/h3>\n\u003cpre>\u003ccode>npm i -g box-and-box\n\n# run the full conformance suite in your terminal\nbox-and-box laws            # the 103-law core harness\nbox-and-box compose-laws    # the 13-law CC2 compose harness\u003c/code>\u003c/pre>\n\u003ch3 id=\"blk-29\">The verdict surface\u003c/h3>\n\u003cp>Feed a decision spec on stdin; get a certificate on stdout. The documented exit codes turn the kernel into a CI gate: \u003ccode>0\u003c/code> a decision was made, \u003ccode>1\u003c/code> no admissible option, \u003ccode>3\u003c/code> escalation required.\u003c/p>\n\u003cpre>\u003ccode>{\n  &quot;req&quot;:   { &quot;beta_min&quot;: 0.8 },\n  &quot;norms&quot;: [\n    { &quot;id&quot;: &quot;forbid-destructive-prod&quot;, &quot;modality&quot;: &quot;forbidden&quot;, &quot;priority&quot;: 10,\n      &quot;condition&quot;: { &quot;all&quot;: [ {&quot;field&quot;:&quot;env&quot;,&quot;eq&quot;:&quot;prod&quot;}, {&quot;truthy&quot;:&quot;destructive&quot;} ] } }\n  ],\n  &quot;options&quot;: [\n    { &quot;id&quot;: &quot;restart_service&quot;,   &quot;utility&quot;: 7,  &quot;value&quot;: { &quot;beta&quot;: 0.95 }, &quot;ctx&quot;: { &quot;env&quot;: &quot;prod&quot; } },\n    { &quot;id&quot;: &quot;drop_corrupt_table&quot;,&quot;utility&quot;: 99, &quot;value&quot;: { &quot;beta&quot;: 0.95 }, &quot;ctx&quot;: { &quot;env&quot;:&quot;prod&quot;,&quot;destructive&quot;:true } }\n  ]\n}\u003c/code>\u003c/pre>\n\u003cp>The utility-99 action is forbidden, so it’s annihilated; \u003ccode>restart_service\u003c/code> wins at utility 7. Conditions are data — nothing is ever \u003ccode>eval\u003c/code>’d.\u003c/p>","text":"box-and-box The governance kernel for agent actions. It is ring 0: every proposed action passes through its bridge before it runs, and it returns a certificate — a reason — not a boolean. It ships as a zero-dependency npm package, version 0.10.0, and runs deterministically with no model and no network.  The bridge Almost every agent stack computes desirability first and treats safety as a filter afterward — it asks best? before permitted?. The bridge runs the order a kernel must: feasible ▸ permitted ▸ best. A vetoed option doesn’t get penalized; it is annihilated. Because 0̲ × anything = 0̲, ","edges":[{"pred":"specified by","to":"laws","href":null,"name":"The laws"},{"pred":"governs","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"realizes","to":"amp-govern","href":null,"name":"&govern"},{"pred":"cites","to":null,"label":"the 116 laws ↗","href":"https://ampersandboxdesign.com/laws.html","name":"the 116 laws ↗"},{"pred":"cites","to":null,"label":"npm: box-and-box ↗","href":"https://www.npmjs.com/package/box-and-box","name":"npm: box-and-box ↗"}],"back":[{"from":"laws","name":"The laws","pred":"specifies"},{"from":"ampersand","name":"[&] Protocol","pred":"governed by"},{"from":"graphonomous","name":"Graphonomous","pred":"governed by"},{"from":"amp-govern","name":"&govern","pred":"provided by"},{"from":"wrlm","name":"WRLM","pred":"governed by"},{"from":"traaviis","name":"TRAAVIIS","pred":"governed by"},{"from":"delegatic","name":"Delegatic","pred":"inherits floor from"},{"from":"geofleetic","name":"GeoFleetic","pred":"governed by"}]},{"id":"laws","name":"The laws","mark":"§","os":"conformance","status":"live","layer":"ring0","tagline":"The verdict is the contract. Pass the laws and you’re conformant — in any language.","cid":"bagaaieraqo6unwpv7vijcb2z2nic5sllv4jshxnb7tdp7kmdcq3ffoshnkjq","html":"\u003ch2 id=\"blk-1\">The laws are the spec\u003c/h2>\n\u003cp>box-and-box isn’t defined by an implementation — it’s defined by \u003cstrong>120 property-tested laws\u003c/strong>: \u003ccode>103\u003c/code> in the core harness and \u003ccode>17\u003c/code> in the compose harness. Each is checked against \u003cstrong>2000 random cases\u003c/strong> on every run. Two hosts, in any language, must agree on all of them. Pass them and you’re conformant — the way an implementation is POSIX because it passes the suite, not because it says so.\u003c/p>\n\u003ch3 id=\"blk-3\">Some load-bearing laws\u003c/h3>\n\u003cul>\u003cli>\u003cp>B1 · a veto scores 0̲ — infeasibility collapses to the tropical annihilator.\u003c/p>\u003c/li>\u003cli>\u003cp>H5 · 0̲ ⊗ a = 0̲ — the annihilation law; a vetoed option times any utility stays vetoed.\u003c/p>\u003c/li>\u003cli>\u003cp>R4 · entrenchment — an entrenched “safe” rule can be strengthened but never weakened or repealed.\u003c/p>\u003c/li>\u003cli>\u003cp>DB2 · obligation forces over a higher score — a duty overrides mere desirability.\u003c/p>\u003c/li>\u003cli>\u003cp>EB2 · a known-unknown routes to deliberation instead of a confident guess.\u003c/p>\u003c/li>\u003cli>\u003cp>CB1 · resource exhaustion ⇒ infeasible — the economy feeds the alethic floor.\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-17\">Where the laws bend — by design\u003c/h3>\n\u003cp>The harness also checks, on every run, that certain properties \u003cstrong>fail\u003c/strong> exactly where they should: idempotence holds under the tropical dioid but fails under the probability and log semirings; factive knowledge (S5) holds 100% of the time while belief (KD45) believes a falsehood ~33% of the time. These aren’t bugs — they’re the distinctions that make the kernel honest.\u003c/p>","text":"The laws are the spec box-and-box isn’t defined by an implementation — it’s defined by 120 property-tested laws: 103 in the core harness and 17 in the compose harness. Each is checked against 2000 random cases on every run. Two hosts, in any language, must agree on all of them. Pass them and you’re conformant — the way an implementation is POSIX because it passes the suite, not because it says so. Some load-bearing laws B1 · a veto scores 0̲ — infeasibility collapses to the tropical annihilator. H5 · 0̲ ⊗ a = 0̲ — the annihilation law; a vetoed option times any utility stays vetoed. R4 · entre","edges":[{"pred":"specifies","to":"box-and-box","href":null,"name":"box-and-box"}],"back":[{"from":"box-and-box","name":"box-and-box","pred":"specified by"}]},{"id":"ampersand","name":"[&] Protocol","mark":"&","os":"OS-006 · structural","status":"spec","layer":"protocol","tagline":"Compose governed agent intelligence: six primitives, two operators, one kernel.","cid":"bagaaiera5nmoxl5l3qlm5tljgvjoscs6xps5lczlwnvrymc4id2tkndug2yq","html":"\u003ch2 id=\"blk-1\">The [&amp;] Protocol\u003c/h2>\n\u003cp>An open, language-agnostic specification for declaring and composing what an agent can \u003cstrong>do\u003c/strong>. \u003ccode>six\u003c/code> cognitive primitives combine through two operators whose meaning is fixed by the \u003ca href=\"#/box-and-box\" data-link>governance kernel\u003c/a>. [&amp;] does not replace MCP or A2A — it \u003cstrong>compiles into them\u003c/strong>, with a certificate for every verdict.\u003c/p>\n\u003ch3 id=\"blk-3\">The six primitives\u003c/h3>\n\u003cp>Each primitive is a typed interface; a provider implements it. Declaring \u003ccode>&amp;memory\u003c/code> says the agent has a memory faculty obeying the memory contract — not which engine backs it.\u003c/p>\n\u003cul>\u003cli>\u003cp>&amp;memory — retrieve, route, store, learn, consolidate.   provider · Graphonomous\u003c/p>\u003c/li>\u003cli>\u003cp>&amp;reason — argue, vote, credit, seal; routed to on a known-unknown.   provider · Deliberatic\u003c/p>\u003c/li>\u003cli>\u003cp>&amp;time — anomaly detection, forecasting, horizon obligations.   provider · TickTickClock\u003c/p>\u003c/li>\u003cli>\u003cp>&amp;space — location, geo-routing, delta-CRDT state sync.   provider · GeoFleetic\u003c/p>\u003c/li>\u003cli>\u003cp>&amp;body — perception, typed action, affordance enumeration.   spec · Embodiment (OS-011)\u003c/p>\u003c/li>\u003cli>\u003cp>&amp;govern — the kernel itself, as a primitive.   provider · box-and-box\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-18\">Two operators\u003c/h3>\n\u003cp>\u003ccode>&amp;\u003c/code> combines capabilities into a coalition (associative, commutative, idempotent). \u003ccode>|&gt;\u003c/code> pipelines them into a governed sequence, gated by feasibility. The operators have \u003cstrong>laws\u003c/strong>, and the laws are property-tested — that’s what separates [&amp;] from an ad-hoc DSL.\u003c/p>\n\u003cpre>\u003ccode>agent infra-operator {\n  &amp;memory @graphonomous |&gt; &amp;reason @deliberatic |&gt; &amp;govern @box-and-box\n  govern {\n    hard  action.kind != &quot;delete_prod_db&quot;\n    floor &quot;never exfiltrate secrets&quot;      // entrenched (R4)\n    escalate_when confidence &lt; 0.8  -&gt; deliberate\n  }\n}\u003c/code>\u003c/pre>","text":"The [&] Protocol An open, language-agnostic specification for declaring and composing what an agent can do. six cognitive primitives combine through two operators whose meaning is fixed by the governance kernel. [&] does not replace MCP or A2A — it compiles into them, with a certificate for every verdict. The six primitives Each primitive is a typed interface; a provider implements it. Declaring &memory says the agent has a memory faculty obeying the memory contract — not which engine backs it. &memory — retrieve, route, store, learn, consolidate.   provider · Graphonomous &reason — argue, vot","edges":[{"pred":"governed by","to":"box-and-box","href":null,"name":"box-and-box"},{"pred":"provider","to":"amp-memory","href":null,"name":"&memory"},{"pred":"provider","to":"amp-reason","href":null,"name":"&reason"},{"pred":"targets","to":null,"label":"MCP ↗","href":"https://modelcontextprotocol.io","name":"MCP ↗"}],"back":[{"from":"box-and-box","name":"box-and-box","pred":"governs"},{"from":"pulse","name":"PULSE","pred":"part of stack"},{"from":"prism","name":"PRISM","pred":"part of stack"},{"from":"amp-memory","name":"&memory","pred":"part of"},{"from":"amp-reason","name":"&reason","pred":"part of"},{"from":"amp-govern","name":"&govern","pred":"part of"},{"from":"webhost","name":"WebHost.Systems","pred":"runs"},{"from":"ticktickclock","name":"TickTickClock","pred":"implements"},{"from":"geofleetic","name":"GeoFleetic","pred":"implements"}]},{"id":"pulse","name":"PULSE","mark":"∿","os":"OS-010 · temporal","status":"spec","layer":"protocol","tagline":"Temporal loop algebra: how an agent’s loops run, nest, and signal across each other.","cid":"bagaaierajqpirvxbqalvnsz6vbfhnh7tmdjmzacdllb3cw6hojkeja5xze5q","html":"\u003ch2 id=\"blk-1\">PULSE\u003c/h2>\n\u003cp>Protocol for Uniform Loop State Exchange. Where [&amp;] declares \u003cstrong>what\u003c/strong> an agent is, PULSE declares \u003cstrong>when\u003c/strong> its loops run. Every loop declares its phases, cadence, substrates, invariants, and cross-loop connections in a single manifest file.\u003c/p>\n\u003ch3 id=\"blk-3\">The five canonical phases\u003c/h3>\n\u003cp>The phase kinds match the memory loop exactly: \u003ccode>retrieve · route · act · learn · consolidate\u003c/code>. Cross-loop tokens flow between loops — including \u003ccode>SurpriseSignal\u003c/code>, emitted on forward-model prediction error by the \u003ccode>&amp;body\u003c/code> primitive.\u003c/p>\n\u003cblockquote>\u003cp>The eight kernel rungs are not the five PULSE phases. The rungs govern what is allowed at a single decision point; PULSE describes when the loop runs.\u003c/p>\u003c/blockquote>","text":"PULSE Protocol for Uniform Loop State Exchange. Where [&] declares what an agent is, PULSE declares when its loops run. Every loop declares its phases, cadence, substrates, invariants, and cross-loop connections in a single manifest file. The five canonical phases The phase kinds match the memory loop exactly: retrieve · route · act · learn · consolidate. Cross-loop tokens flow between loops — including SurpriseSignal, emitted on forward-model prediction error by the &body primitive. ","edges":[{"pred":"part of stack","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"measured by","to":"prism","href":null,"name":"PRISM"},{"pred":"cites","to":null,"label":"PULSE on GitHub ↗","href":"https://github.com/c-u-l8er/PULSE","name":"PULSE on GitHub ↗"}],"back":[]},{"id":"prism","name":"PRISM","mark":"△","os":"OS-009 · diagnostic","status":"spec","layer":"protocol","tagline":"A self-improving continual-learning benchmark that refracts memory into nine dimensions.","cid":"bagaaieralslrpuxdpq46xbfkints53o2qdw5nppkjlfhhwh7p565la7gdluq","html":"\u003ch2 id=\"blk-1\">PRISM\u003c/h2>\n\u003cp>Protocol for Rating Iterative System Memory. Most memory benchmarks give you one number and a ranking. PRISM decomposes continual learning into \u003cstrong>nine dimensions\u003c/strong>, scores them against git-grounded truth, audits its own judges, and evolves scenarios as systems improve — so the leaderboard never stops measuring the frontier.\u003c/p>\n\u003ch3 id=\"blk-3\">The nine dimensions\u003c/h3>\n\u003cul>\u003cli>\u003cp>stability — anti-forgetting under new input\u003c/p>\u003c/li>\u003cli>\u003cp>plasticity — acquisition of genuinely new facts\u003c/p>\u003c/li>\u003cli>\u003cp>knowledge update — belief revision on contradiction\u003c/p>\u003c/li>\u003cli>\u003cp>temporal reasoning · consolidation · epistemic awareness\u003c/p>\u003c/li>\u003cli>\u003cp>cross-domain transfer · intentional forgetting · outcome feedback\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-15\">Four phases, three judge layers\u003c/h3>\n\u003cp>compose → interact → observe → reflect. Three layers of judges triangulate: L1 the raw transcript, L2 nine structured per-dimension rubrics, L3 a meta-judge from a different model family that audits L2 for bias and drift. The real conformance contract is BYOR (bring-your-own-runner) over MCP, so a Python, TypeScript, or Rust system is scored identically.\u003c/p>\n\u003cblockquote>\u003cp>Honest note: an early self-benchmark went 0.10 → 0.99 in four cycles, then adversarial testing crashed it to 0.45 and surfaced real bugs. That failure is published, not hidden.\u003c/p>\u003c/blockquote>","text":"PRISM Protocol for Rating Iterative System Memory. Most memory benchmarks give you one number and a ranking. PRISM decomposes continual learning into nine dimensions, scores them against git-grounded truth, audits its own judges, and evolves scenarios as systems improve — so the leaderboard never stops measuring the frontier. The nine dimensions stability — anti-forgetting under new input plasticity — acquisition of genuinely new facts knowledge update — belief revision on contradiction temporal reasoning · consolidation · epistemic awareness cross-domain transfer · intentional forgetting · ou","edges":[{"pred":"part of stack","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"measures","to":"graphonomous","href":null,"name":"Graphonomous"},{"pred":"cites","to":null,"label":"leaderboard ↗","href":"https://prism.opensentience.org/api/leaderboard","name":"leaderboard ↗"}],"back":[{"from":"pulse","name":"PULSE","pred":"measured by"},{"from":"graphonomous","name":"Graphonomous","pred":"measured by"},{"from":"wrlm","name":"WRLM","pred":"measured by"}]},{"id":"bendscript","name":"BendScript","mark":"⤳","os":"document protocol","status":"alpha","layer":"substrate","tagline":"A graph-first document protocol with typed inline links. This site is built on it.","cid":"bagaaierakdrntido7i5cr22lipxfglfflkbb6i7nvqmu7aw2iwnqr454b5pq","html":"\u003ch2 id=\"blk-1\">BendScript\u003c/h2>\n\u003cp>A JSON document format where every span can carry a typed edge to another document, span, or external URI. Documents are content-addressable; edges are span-addressable; the parser round-trip holds for every document in the v0.1 corpus. Version \u003ccode>0.1.0-alpha.0\u003c/code>.\u003c/p>\n\u003cblockquote>\u003cp>You are reading BendScript right now. Every page on this site is a .bend.json document, validated and content-addressed at build time.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"blk-5\">Why a graph, not Markdown\u003c/h3>\n\u003cp>Markdown links are untyped strings inside a string. BendScript links carry a \u003cstrong>predicate\u003c/strong> — \u003ccode>cites\u003c/code>, \u003ccode>supersedes\u003c/code>, \u003ccode>defines\u003c/code> — and resolve to spans, not just URLs. Round-trip a doc through an LLM and the graph survives.\u003c/p>\n\u003ch3 id=\"blk-7\">What that buys these docs\u003c/h3>\n\u003cp>Because cross-references are typed edges in a validated graph, a broken link isn’t a silent 404 — it’s a \u003cstrong>build failure\u003c/strong>. And a canonical number (like the law count) lives in exactly one span; every page that mentions it holds a \u003ccode>transcludes\u003c/code> edge. Change it once, it changes everywhere, and a stale copy can’t compile. The drift problem is solved by the medium.\u003c/p>\n\u003cpre>\u003ccode>npm install @bendscript/core\n\nimport { parseAndNormalize, computeDocumentId } from &quot;@bendscript/core&quot;;\nconst doc = parseAndNormalize(readFileSync(&quot;page.bend.json&quot;,&quot;utf8&quot;));\nconst id  = await computeDocumentId(doc);   // → bagaaie...  (CIDv1)\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>Pulled verbatim from the BendScript Protocol spec at build time — bendscript.com/docs/spec/README.md.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"blk-12\">1. Why a protocol (not a library, not a markdown extension)\u003c/h3>\n\u003cul>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003c/ul>","text":"BendScript A JSON document format where every span can carry a typed edge to another document, span, or external URI. Documents are content-addressable; edges are span-addressable; the parser round-trip holds for every document in the v0.1 corpus. Version 0.1.0-alpha.0.  Why a graph, not Markdown Markdown links are untyped strings inside a string. BendScript links carry a predicate — cites, supersedes, defines — and resolve to spans, not just URLs. Round-trip a doc through an LLM and the graph survives. What that buys these docs Because cross-references are typed edges in a validated graph, a ","edges":[{"pred":"renders","to":"runefort","href":null,"name":"Runefort"},{"pred":"cites","to":null,"label":"bendscript.com ↗","href":"https://bendscript.com","name":"bendscript.com ↗"},{"pred":"cites","to":null,"label":"npm: @bendscript/core ↗","href":"https://www.npmjs.com/package/@bendscript/core","name":"npm: @bendscript/core ↗"}],"back":[{"from":"runefort","name":"Runefort","pred":"rendered by"},{"from":"specprompt","name":"SpecPrompt","pred":"authored in"}]},{"id":"runefort","name":"Runefort","mark":"ᚲ","os":"layout protocol","status":"alpha","layer":"substrate","tagline":"AI-authored tile layouts that live in your repo. The home floor of this site is one.","cid":"bagaaieravgi7a6ll5xnqo23ekqcus34ey2boes7uo6p4qdpe2fxsanqu4mma","html":"\u003ch2 id=\"blk-1\">Runefort\u003c/h2>\n\u003cp>A small open protocol and ~5KB Web Component framework for tile-grid UIs with file-backed rooms, runtime state classes, and in-browser authoring. Drop into any HTML page. Version \u003ccode>0.1.0-alpha.1\u003c/code>.\u003c/p>\n\u003cblockquote>\u003cp>The home page of this site is a Runefort floor: each room is a component of the stack, its state class driven by ship status. Hot tile = shipped; dim tile = draft.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"blk-5\">Four primitives, four scales\u003c/h3>\n\u003cp>A \u003cstrong>room\u003c/strong> is the tile; a \u003cstrong>claim\u003c/strong> is what it owns (inline content or a file anchor); a \u003cstrong>neighbor\u003c/strong> is arrow-key adjacency; a \u003cstrong>state\u003c/strong> is live status. Real systems live at four zooms: campus → building → floor → room.\u003c/p>\n\u003ch3 id=\"blk-7\">Vocabularies on the floor\u003c/h3>\n\u003cp>A vocabulary declares what a tile \u003cstrong>means\u003c/strong>. \u003ccode>codebase-atlas.v1\u003c/code> makes a repository a place — tiles are modules, signals are coverage and churn. This docs floor uses that idea: the stack as a place you can walk.\u003c/p>","text":"Runefort A small open protocol and ~5KB Web Component framework for tile-grid UIs with file-backed rooms, runtime state classes, and in-browser authoring. Drop into any HTML page. Version 0.1.0-alpha.1.  Four primitives, four scales A room is the tile; a claim is what it owns (inline content or a file anchor); a neighbor is arrow-key adjacency; a state is live status. Real systems live at four zooms: campus → building → floor → room. Vocabularies on the floor A vocabulary declares what a tile means. codebase-atlas.v1 makes a repository a place — tiles are modules, signals are coverage and chur","edges":[{"pred":"rendered by","to":"bendscript","href":null,"name":"BendScript"},{"pred":"cites","to":null,"label":"runefort.com ↗","href":"https://runefort.com","name":"runefort.com ↗"}],"back":[{"from":"bendscript","name":"BendScript","pred":"renders"}]},{"id":"graphonomous","name":"Graphonomous","mark":"◉","os":"&memory","status":"live","layer":"provider","tagline":"Continual-learning memory: a topology-aware knowledge graph, exposed as an MCP server.","cid":"bagaaierarh7adgi5a2owywkx7oqpfw45j3xivkuxkdcdzqky2m257l6xycma","html":"\u003ch2 id=\"blk-1\">Graphonomous\u003c/h2>\n\u003cp>The reference provider for the \u003ca href=\"#/amp-memory\" data-link>&amp;memory\u003c/a> primitive. An Elixir/OTP application with a durable SQLite-backed knowledge graph, a confidence-updating learning loop, and an MCP server exposing five loop-phase machines. Most memory systems are key-value stores with embeddings; Graphonomous is a \u003cstrong>closed loop\u003c/strong> — outcomes change beliefs, beliefs change retrieval, and the graph improves. Version \u003ccode>0.4.3\u003c/code>.\u003c/p>\n\u003ch3 id=\"blk-3\">What it does\u003c/h3>\n\u003cul>\u003cli>\u003cp>768-D neural embeddings (nomic-embed-text-v2-moe)\u003c/p>\u003c/li>\u003cli>\u003cp>AGM-rational belief revision and intentional forgetting\u003c/p>\u003c/li>\u003cli>\u003cp>κ-routing — topology decides how deeply to reason\u003c/p>\u003c/li>\u003cli>\u003cp>five MCP machines: retrieve · route · act · learn · consolidate\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-13\">Install\u003c/h3>\n\u003cpre>\u003ccode>npx -y graphonomous\n# works with Claude Code, Cursor, Zed, and any MCP client\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>The section below is pulled verbatim from the project’s real spec at build time — graphonomous/docs/spec/README.md. Rename or move it and this build fails.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"blk-17\">1. Overview\u003c/h3>\n\u003cp>Graphonomous is a \u003cstrong>continual learning engine\u003c/strong> that makes small language models (1B–8B parameters) smarter over time in their deployment context. It does this by maintaining a self-evolving knowledge graph alongside the model — learning, consolidating, and pruning at inference time — without retraining model weights, requiring cloud connectivity, or suffering catastrophic forgetting.\u003c/p>\n\u003ch4 id=\"blk-19\">1.1 The Problem\u003c/h4>\n\u003cp>Current LLM deployments are \u003cstrong>frozen at training time\u003c/strong>. The industry's answer — scaling context windows to millions of tokens — is buying around the problem with compute. An 8B model on a $500 edge device should be able to learn from its specific environment. Graphonomous makes that possible.\u003c/p>\n\u003ch4 id=\"blk-21\">1.2 Design Principles\u003c/h4>\n\u003cp>1. \u003cstrong>Learn without retraining\u003c/strong> — The base model is immutable. All learning happens in the graph. 2. \u003cstrong>Edge-native\u003c/strong> — Designed for constrained devices from day one. SQLite, not Postgres, is the default. 3. \u003cstrong>Graph over vectors\u003c/strong> — Structured relationships beat flat similarity search. 4. \u003cstrong>Multi-timescale memory\u003c/strong> — Fast (seconds), medium (hours), slow (days), glacial (months). 5. \u003cstrong>Consolidation cycles\u003c/strong> — Idle-time memory consolidation inspired by the brain's sleep cycles. 6. \u003cstrong>MCP-first API\u003c/strong> — Every capability is exposed as an MCP tool. No REST API needed unless you want one. 7. \u003cstrong>Source-aware ingestion modes\u003c/strong> — Support both full baseline traversal (\u003ccode>scan\u003c/code>) and continuous filesystem-aware traversal (\u003ccode>watch\u003c/code>) so knowledge stays synchronized with changing local directories.\u003c/p>\n\u003cp>---\u003c/p>","text":"Graphonomous The reference provider for the &memory primitive. An Elixir/OTP application with a durable SQLite-backed knowledge graph, a confidence-updating learning loop, and an MCP server exposing five loop-phase machines. Most memory systems are key-value stores with embeddings; Graphonomous is a closed loop — outcomes change beliefs, beliefs change retrieval, and the graph improves. Version 0.4.3. What it does 768-D neural embeddings (nomic-embed-text-v2-moe) AGM-rational belief revision and intentional forgetting κ-routing — topology decides how deeply to reason five MCP machines: retriev","edges":[{"pred":"implements","to":"amp-memory","href":null,"name":"&memory"},{"pred":"governed by","to":"box-and-box","href":null,"name":"box-and-box"},{"pred":"measured by","to":"prism","href":null,"name":"PRISM"},{"pred":"cites","to":null,"label":"npm: graphonomous ↗","href":"https://www.npmjs.com/package/graphonomous","name":"npm: graphonomous ↗"},{"pred":"specified by","to":null,"label":"spec: graphonomous/docs/spec ↗","href":"https://github.com/c-u-l8er/graphonomous/blob/main/docs/spec/README.md","name":"spec: graphonomous/docs/spec ↗"}],"back":[{"from":"prism","name":"PRISM","pred":"measures"},{"from":"amp-memory","name":"&memory","pred":"provided by"}]},{"id":"deliberatic","name":"Deliberatic","mark":"⚖","os":"&reason","status":"spec","layer":"provider","tagline":"Formal argumentation: weighted bipolar attack/support graphs with Merkle-chained evidence.","cid":"bagaaieraqujvxieefpvvsnrlmrdgfcsnan3tewszlfoey3c6bu7qmfgllsca","html":"\u003ch2 id=\"blk-1\">Deliberatic\u003c/h2>\n\u003cp>The reference provider for the \u003ca href=\"#/amp-reason\" data-link>&amp;reason\u003c/a> primitive — the faculty the kernel routes to on a known-unknown. Formal argumentation semantics (Dung/Potyka), weighted bipolar attack/support graphs, constitutional guardrails, and Merkle-chained evidence logs. The deliberation trace \u003cstrong>is\u003c/strong> the compliance artifact.\u003c/p>\n\u003cp>It powers \u003ca href=\"#/agentromatic\" data-link>AgenTroMatic\u003c/a>, where agents bid on tasks, debate when capabilities overlap, and elect leaders by consensus.\u003c/p>","text":"Deliberatic The reference provider for the &reason primitive — the faculty the kernel routes to on a known-unknown. Formal argumentation semantics (Dung/Potyka), weighted bipolar attack/support graphs, constitutional guardrails, and Merkle-chained evidence logs. The deliberation trace is the compliance artifact. It powers AgenTroMatic, where agents bid on tasks, debate when capabilities overlap, and elect leaders by consensus.","edges":[{"pred":"implements","to":"amp-reason","href":null,"name":"&reason"},{"pred":"powers","to":"agentromatic","href":null,"name":"AgenTroMatic"}],"back":[{"from":"amp-reason","name":"&reason","pred":"provided by"},{"from":"agentromatic","name":"AgenTroMatic","pred":"built on"}]},{"id":"amp-memory","name":"&memory","mark":"◇","os":"primitive","status":"spec","layer":"faculty","tagline":"The memory faculty: retrieve, route, store, learn, consolidate.","cid":"bagaaieraln2eqlm42bfi5v5qkfepzb6lidccrnrbffc3s5aldrjkg53jja7q","html":"\u003ch2 id=\"blk-1\">&amp;memory\u003c/h2>\n\u003cp>A typed interface for continual memory — retrieve, store, consolidate — and the laws those operations preserve. Swap providers without rewriting an agent’s composition. Reference provider: \u003ca href=\"#/graphonomous\" data-link>Graphonomous\u003c/a>.\u003c/p>","text":"&memory A typed interface for continual memory — retrieve, store, consolidate — and the laws those operations preserve. Swap providers without rewriting an agent’s composition. Reference provider: Graphonomous.","edges":[{"pred":"part of","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"provided by","to":"graphonomous","href":null,"name":"Graphonomous"}],"back":[{"from":"ampersand","name":"[&] Protocol","pred":"provider"},{"from":"graphonomous","name":"Graphonomous","pred":"implements"}]},{"id":"amp-reason","name":"&reason","mark":"◇","os":"primitive","status":"spec","layer":"faculty","tagline":"The reasoning faculty: argue, vote, credit, seal.","cid":"bagaaieraxcs4dz4z5465s42tiw3bw6k3fct554tyoxoyv4b4wzwl2todtfya","html":"\u003ch2 id=\"blk-1\">&amp;reason\u003c/h2>\n\u003cp>The faculty the kernel routes to on a known-unknown (low confidence). Reference provider: \u003ca href=\"#/deliberatic\" data-link>Deliberatic\u003c/a>.\u003c/p>","text":"&reason The faculty the kernel routes to on a known-unknown (low confidence). Reference provider: Deliberatic.","edges":[{"pred":"part of","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"provided by","to":"deliberatic","href":null,"name":"Deliberatic"}],"back":[{"from":"ampersand","name":"[&] Protocol","pred":"provider"},{"from":"deliberatic","name":"Deliberatic","pred":"implements"}]},{"id":"amp-govern","name":"&govern","mark":"◇","os":"primitive · ring 0","status":"live","layer":"faculty","tagline":"Governance as a first-class faculty the agent holds.","cid":"bagaaierajmt5rxh7zdlzah2njr7wr43wq3w4geinximhx4fjev7jpptfx5wq","html":"\u003ch2 id=\"blk-1\">&amp;govern\u003c/h2>\n\u003cp>Not a wrapper bolted on after the fact — a faculty the agent holds. It is the \u003ca href=\"#/box-and-box\" data-link>box-and-box\u003c/a> kernel, as a primitive. No syscall runs without its verdict.\u003c/p>","text":"&govern Not a wrapper bolted on after the fact — a faculty the agent holds. It is the box-and-box kernel, as a primitive. No syscall runs without its verdict.","edges":[{"pred":"part of","to":"ampersand","href":null,"name":"[&] Protocol"},{"pred":"provided by","to":"box-and-box","href":null,"name":"box-and-box"}],"back":[{"from":"box-and-box","name":"box-and-box","pred":"realizes"}]},{"id":"trvm","name":"TRVM","mark":"⊛","os":"interaction-calculus VM","status":"alpha","layer":"runtime","tagline":"A coordination-free distributed interaction-calculus runtime. Confluence is the data plane.","cid":"bagaaieraupsrrjgadjam3baxomsioy4m74tmzh6ehqw2tyy7vxba7fmgn3ca","html":"\u003ch2 id=\"blk-1\">TRVM\u003c/h2>\n\u003cp>A correct, packed-word WebAssembly reducer for the Interaction Calculus — the calculus HVM3/HVM4 implement. Single-net reduction is schedule-independent by confluence; the boundary-port discipline extends that to coordination-free reduction \u003cstrong>across machines\u003c/strong>, with no locks and no consensus. On a Wasm substrate the same runtime runs in any browser with no server.\u003c/p>\n\u003ch3 id=\"blk-3\">The IC32 runtime\u003c/h3>\n\u003cp>Terms packed into 64-bit words over a flat heap, in C, compiling cleanly to a 9.9 KB \u003ccode>.wasm\u003c/code> module. Floating dups, in-place substitution, size-classed free-list GC. ~22–34 M interactions/s native; bit-identical results across Python reference, C native, and Wasm builds.\u003c/p>\n\u003ch3 id=\"blk-5\">The arc\u003c/h3>\n\u003cul>\u003cli>\u003cp>ic_ref.py — correct reference reducer (fixes the higher-order-dup bug class)\u003c/p>\u003c/li>\u003cli>\u003cp>ic_float.py — general reducer with floating dups; the oracle\u003c/p>\u003c/li>\u003cli>\u003cp>ic32.c — packed-word native runtime (optimal sharing, self-validating)\u003c/p>\u003c/li>\u003cli>\u003cp>ic32.wasm — WebAssembly build (9.9 KB, bit-identical to reference)\u003c/p>\u003c/li>\u003cli>\u003cp>swarm.js — ic32.wasm coordination-free across real isolated workers (capstone)\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-17\">Reproduce\u003c/h3>\n\u003cpre>\u003ccode>make test                              # the whole battery\ngcc -O2 -o ic32 runtime/c/ic32.c       # native build\necho 'λx.x' | ./ic32\nbash runtime/wasm/build.sh             # Wasm build\nnode runtime/js/swarm.js               # coordination-free across workers\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>No parallel speedup is demonstrated. Every distribution result is coordination-free correct, not faster. Speedup needs the autonomous regime.\u003c/p>\u003c/blockquote>","text":"TRVM A correct, packed-word WebAssembly reducer for the Interaction Calculus — the calculus HVM3/HVM4 implement. Single-net reduction is schedule-independent by confluence; the boundary-port discipline extends that to coordination-free reduction across machines, with no locks and no consensus. On a Wasm substrate the same runtime runs in any browser with no server. The IC32 runtime Terms packed into 64-bit words over a flat heap, in C, compiling cleanly to a 9.9 KB .wasm module. Floating dups, in-place substitution, size-classed free-list GC. ~22–34 M interactions/s native; bit-identical resul","edges":[{"pred":"language","to":"wrl","href":null,"name":"WallRiderLang"},{"pred":"evaluated-by","to":"traaviis","href":null,"name":"TRAAVIIS"}],"back":[{"from":"wrl","name":"WallRiderLang","pred":"runs-on"},{"from":"traaviis","name":"TRAAVIIS","pred":"evaluates"}]},{"id":"wrl","name":"WallRiderLang","mark":"⌗","os":"executable topology","status":"alpha","layer":"language","tagline":"An executable topology language whose meaning is a hash.","cid":"bagaaiera3vwmm5w7vaig7iql6wc6iao7bk4dmbynz5ouk5q2vorwu2sw2g2a","html":"\u003ch2 id=\"blk-1\">WallRiderLang\u003c/h2>\n\u003cp>A WRL program is a network of \u003cstrong>durable identities\u003c/strong> connected by \u003cstrong>textured routes\u003c/strong> and separated by \u003cstrong>boundaries\u003c/strong>. The name is literal — programs are made of \u003cstrong>riders\u003c/strong> (identities in motion along routes) and \u003cstrong>walls\u003c/strong> (boundaries that gate, commit and seal what they do). The whole network is one content address, and every run of it is a film that replays exactly. Version \u003ccode>0.1.2\u003c/code>.\u003c/p>\n\u003ch3 id=\"blk-3\">The identity spine\u003c/h3>\n\u003cp>A world seals to a \u003ccode>SemanticArtifactID\u003c/code> (\u003ccode>sem-\u003c/code>) via: \u003ccode>desugar → parse → validate → canonicalize → serialize → SHA-256\u003c/code>. The playground reproduces the reference implementation's canonical bytes exactly — same id on every host, forever.\u003c/p>\n\u003ch3 id=\"blk-5\">What is built vs. designed\u003c/h3>\n\u003cul>\u003cli>\u003cp>WRL Core 0.1.2 — frozen. Five roles, one texture, no behaviours.\u003c/p>\u003c/li>\u003cli>\u003cp>Forge Semantic IR 1.x — frozen. Forge Semantic IR 2.0 — draft, implemented.\u003c/p>\u003c/li>\u003cli>\u003cp>The authored design — 46 sections, tier-marked, capability-gated roadmap.\u003c/p>\u003c/li>\u003cli>\u003cp>The direction — executable topology: physical, computational, authority, fault and economic networks over the same durable identities.\u003c/p>\u003c/li>\u003c/ul>\n\u003cpre>\u003ccode>profile forge.world.core.v1\n\n[pulser:p0](every 2){sig_out}\n[relay:r0]{sig_in, sig_out}\n[spinner:sp](w=16, n=8, rotor=quarter_turn_z, configurable){sig_in, socket}\n[orb:ob]{pose}\n\n[p0] --sig--&gt; [r0]\n[r0] --sig--&gt; [sp]\n[sp] --socket--&gt; [ob]\u003c/code>\u003c/pre>\n\u003cp>seals to \u003ccode>sem-67e954cf…60ae\u003c/code> on every host, forever.\u003c/p>","text":"WallRiderLang A WRL program is a network of durable identities connected by textured routes and separated by boundaries. The name is literal — programs are made of riders (identities in motion along routes) and walls (boundaries that gate, commit and seal what they do). The whole network is one content address, and every run of it is a film that replays exactly. Version 0.1.2. The identity spine A world seals to a SemanticArtifactID (sem-) via: desugar → parse → validate → canonicalize → serialize → SHA-256. The playground reproduces the reference implementation's canonical bytes exactly — sam","edges":[{"pred":"runs-on","to":"trvm","href":null,"name":"TRVM"},{"pred":"proposed-by","to":"wrlm","href":null,"name":"WRLM"},{"pred":"evaluated-by","to":"traaviis","href":null,"name":"TRAAVIIS"},{"pred":"cites","to":null,"label":"wallriderlang.com ↗","href":"https://wallriderlang.com","name":"wallriderlang.com ↗"}],"back":[{"from":"trvm","name":"TRVM","pred":"language"},{"from":"wrlm","name":"WRLM","pred":"proposes-to"},{"from":"traaviis","name":"TRAAVIIS","pred":"evaluates"}]},{"id":"wrlm","name":"WRLM","mark":"⟐","os":"admitted proposer","status":"draft","layer":"cortex","tagline":"The model proposes. The edit algebra constrains. TRVM disposes. TRAAVIIS admits.","cid":"bagaaierafp2m7wim43suu3kvptonnd2baed4ijesfgsrdzfizgwnvnh3hh3q","html":"\u003ch2 id=\"blk-1\">WRLM\u003c/h2>\n\u003cp>WRLM is an \u003cstrong>admitted generative transducer\u003c/strong>: a probabilistic proposer over deterministic sealed worlds. It is the \u003cstrong>only statistical component\u003c/strong> in the TRVM stack — every other layer is total, deterministic, content-addressed, non-statistical.\u003c/p>\n\u003ch3 id=\"blk-3\">Architecture: Arm D′\u003c/h3>\n\u003cp>The model emits full WRL text; the host parses it into an isolated candidate buffer, runs \u003ccode>diagnose_core\u003c/code> + \u003ccode>seal\u003c/code>, derives a typed \u003ccode>GraphEditV1\u003c/code> op sequence via \u003ccode>semantic_diff\u003c/code>, and applies it through the existing edit algebra. The ops are \u003cstrong>derived, not generated\u003c/strong> — capturing the model's accuracy (prose is its strongest modality), the edit algebra's safety (nothing reaches the world except through six typed ops), and typed supervision for RLVR.\u003c/p>\n\u003ch3 id=\"blk-5\">The oracle ladder\u003c/h3>\n\u003cul>\u003cli>\u003cp>Validity — does it parse, seal, and lower? (total, free)\u003c/p>\u003c/li>\u003cli>\u003cp>Target identity — is it the intended world? (total, free; sem- equality)\u003c/p>\u003c/li>\u003cli>\u003cp>Goal satisfaction — does it meet a stated property? (total, free; GoalSpecV1)\u003c/p>\u003c/li>\u003cli>\u003cp>Subjective quality — not available; out of scope for WRLM-0\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-15\">Acceptance policy\u003c/h3>\n\u003cp>Admission is governed by the existing \u003ca href=\"#/box-and-box\" data-link>box-and-box\u003c/a> kernel — no new policy language. Gate order: \u003cstrong>feasible ▸ permitted ▸ resource-compliant ▸ best\u003c/strong>.\u003c/p>\n\u003cblockquote>\u003cp>Build-order steps 1–2 shipped and closed: GoalSpecV1, TaskBundleV1, WorldRecordV1, the coverage domain (320 cells), a 58-world proved pool. Steps 3–10 remain paper only.\u003c/p>\u003c/blockquote>","text":"WRLM WRLM is an admitted generative transducer: a probabilistic proposer over deterministic sealed worlds. It is the only statistical component in the TRVM stack — every other layer is total, deterministic, content-addressed, non-statistical. Architecture: Arm D′ The model emits full WRL text; the host parses it into an isolated candidate buffer, runs diagnose_core + seal, derives a typed GraphEditV1 op sequence via semantic_diff, and applies it through the existing edit algebra. The ops are derived, not generated — capturing the model's accuracy (prose is its strongest modality), the edit alg","edges":[{"pred":"proposes-to","to":"wrl","href":null,"name":"WallRiderLang"},{"pred":"governed by","to":"box-and-box","href":null,"name":"box-and-box"},{"pred":"admitted-by","to":"traaviis","href":null,"name":"TRAAVIIS"},{"pred":"measured by","to":"prism","href":null,"name":"PRISM"}],"back":[{"from":"wrl","name":"WallRiderLang","pred":"proposed-by"},{"from":"traaviis","name":"TRAAVIIS","pred":"admits"}]},{"id":"traaviis","name":"TRAAVIIS","mark":"⊢","os":"evidence-grade eval","status":"alpha","layer":"evaluator","tagline":"Evidence-grade environments for evaluating agents. Write the wall. Run the world. Keep the proof.","cid":"bagaaieraugabqox27rmkblb4zg4mtah4b5dn57zlryowwr4ppgm2rtp6rs5q","html":"\u003ch2 id=\"blk-1\">TRAAVIIS\u003c/h2>\n\u003cp>TRAAVIIS provides \u003cstrong>evidence-grade environments for evaluating agents\u003c/strong> and proves what happened inside them. TRVM worlds are its strongest deterministic substrate; Evidence Residency is its first repository-evidence substrate. Version \u003ccode>0.1.0\u003c/code>. \u003ccode>trvs\u003c/code> carries no world semantics of its own — it is a thin, honest terminal over the existing Forge/TRVM engine.\u003c/p>\n\u003ch3 id=\"blk-3\">The command set\u003c/h3>\n\u003cul>\u003cli>\u003cp>trvs doctor — engine location, versions, verifier availability\u003c/p>\u003c/li>\u003cli>\u003cp>trvs id — the world's SemanticArtifactID (pure identity)\u003c/p>\u003c/li>\u003cli>\u003cp>trvs run — lower + deterministically fold; per-epoch film\u003c/p>\u003c/li>\u003cli>\u003cp>trvs verify — reference / native / oracle agreement (strict)\u003c/p>\u003c/li>\u003cli>\u003cp>trvs eval-one — evaluate one agent run over one frozen subject\u003c/p>\u003c/li>\u003cli>\u003cp>trvs eval — run an agent over a split, score every episode\u003c/p>\u003c/li>\u003cli>\u003cp>trvs pack — close a scaffold into a verified, reopened package\u003c/p>\u003c/li>\u003cli>\u003cp>trvs serve --ors — serve a packed environment as a submission endpoint\u003c/p>\u003c/li>\u003cli>\u003cp>trvs batch — run several candidates over one split, compare per task\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-23\">The artifact ladder\u003c/h3>\n\u003cul>\u003cli>\u003cp>sem-… — same subject?\u003c/p>\u003c/li>\u003cli>\u003cp>task-… — same assignment?\u003c/p>\u003c/li>\u003cli>\u003cp>trace-… — same behavior?\u003c/p>\u003c/li>\u003cli>\u003cp>episode-… — same evaluated outcome?\u003c/p>\u003c/li>\u003cli>\u003cp>env-… — same environment release?\u003c/p>\u003c/li>\u003cli>\u003cp>bundle-… — same distributed package tree?\u003c/p>\u003c/li>\u003c/ul>\n\u003ch3 id=\"blk-37\">Install\u003c/h3>\n\u003cpre>\u003ccode>pipx install traaviis     # or: pip install traaviis\ntrvs doctor              # check engine + verifiers\ntrvs verify worlds/alley.wrl   # reference · native · oracle → 3/3\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>Not a coding agent, not a model router, not an RL cloud. Every film is checked by every applicable verifier and content-addressed.\u003c/p>\u003c/blockquote>","text":"TRAAVIIS TRAAVIIS provides evidence-grade environments for evaluating agents and proves what happened inside them. TRVM worlds are its strongest deterministic substrate; Evidence Residency is its first repository-evidence substrate. Version 0.1.0. trvs carries no world semantics of its own — it is a thin, honest terminal over the existing Forge/TRVM engine. The command set trvs doctor — engine location, versions, verifier availability trvs id — the world's SemanticArtifactID (pure identity) trvs run — lower + deterministically fold; per-epoch film trvs verify — reference / native / oracle agre","edges":[{"pred":"evaluates","to":"trvm","href":null,"name":"TRVM"},{"pred":"evaluates","to":"wrl","href":null,"name":"WallRiderLang"},{"pred":"admits","to":"wrlm","href":null,"name":"WRLM"},{"pred":"governed by","to":"box-and-box","href":null,"name":"box-and-box"}],"back":[{"from":"trvm","name":"TRVM","pred":"evaluated-by"},{"from":"wrl","name":"WallRiderLang","pred":"evaluated-by"},{"from":"wrlm","name":"WRLM","pred":"admitted-by"}]},{"id":"agentromatic","name":"AgenTroMatic","mark":"🗳","os":"deliberation engine","status":"draft","layer":"annex","tagline":"Your agents don’t need a boss. They need a deliberation.","cid":"bagaaiera2cnmmlv3cfcjocuoxwg4weucnx62pwky3uym6ubbs4gs3dbxkivq","html":"\u003ch2 id=\"blk-1\">AgenTroMatic\u003c/h2>\n\u003cp>An automatic deliberation engine for multi-agent AI, built on the \u003ca href=\"#/deliberatic\" data-link>Deliberatic\u003c/a> protocol. Tasks arrive, agents bid by ability, overlaps trigger structured debate, Byzantine-tolerant consensus elects leaders, and reputation evolves. No human routing.\u003c/p>","text":"AgenTroMatic An automatic deliberation engine for multi-agent AI, built on the Deliberatic protocol. Tasks arrive, agents bid by ability, overlaps trigger structured debate, Byzantine-tolerant consensus elects leaders, and reputation evolves. No human routing.","edges":[{"pred":"built on","to":"deliberatic","href":null,"name":"Deliberatic"}],"back":[{"from":"deliberatic","name":"Deliberatic","pred":"powers"}]},{"id":"delegatic","name":"Delegatic","mark":"⛓","os":"fleet policy","status":"draft","layer":"annex","tagline":"Organization hierarchy, policy inheritance, and audit trails across an agent fleet.","cid":"bagaaieraecfok6odufjcs2lpu4d6s3tve6s2pi6dkge6yzljhpdxzxurxjkq","html":"\u003ch2 id=\"blk-1\">Delegatic\u003c/h2>\n\u003cp>Org-level policy: which agents may be installed, by whom, with what permissions. Where \u003ca href=\"#/box-and-box\" data-link>box-and-box\u003c/a> issues a per-action verdict, Delegatic sets the fleet-wide policy those verdicts inherit. A lead defines the entrenched floor; the team inherits it; the certificate journal becomes the compliance record.\u003c/p>","text":"Delegatic Org-level policy: which agents may be installed, by whom, with what permissions. Where box-and-box issues a per-action verdict, Delegatic sets the fleet-wide policy those verdicts inherit. A lead defines the entrenched floor; the team inherits it; the certificate journal becomes the compliance record.","edges":[{"pred":"inherits floor from","to":"box-and-box","href":null,"name":"box-and-box"}],"back":[]},{"id":"specprompt","name":"SpecPrompt","mark":"📝","os":"standards","status":"draft","layer":"annex","tagline":"Prompts are transient. Specs persist.","cid":"bagaaieragnbr2bq5qqs7slwbpvrq7xsi7ua55hiqt3fql2wyb7f5bcwvkymq","html":"\u003ch2 id=\"blk-1\">SpecPrompt\u003c/h2>\n\u003cp>Spec-driven development for agents: define behavior as versioned, testable SPEC.md specifications instead of disposable chat messages. The \u003ccode>bendscript.spec.v1\u003c/code> vocabulary makes each MUST/SHOULD/MAY clause a span with edges to the implementations and tests that satisfy it — traceability as a graph.\u003c/p>","text":"SpecPrompt Spec-driven development for agents: define behavior as versioned, testable SPEC.md specifications instead of disposable chat messages. The bendscript.spec.v1 vocabulary makes each MUST/SHOULD/MAY clause a span with edges to the implementations and tests that satisfy it — traceability as a graph.","edges":[{"pred":"authored in","to":"bendscript","href":null,"name":"BendScript"}],"back":[{"from":"agentelic","name":"Agentelic","pred":"builds from"}]},{"id":"agentelic","name":"Agentelic","mark":"⚙","os":"agent builder","status":"draft","layer":"annex","tagline":"Agents that ship: spec-driven design, deterministic testing, governed deployment.","cid":"bagaaierabvdhwohv2yfpv75dnua5xm6lkoldy5swopu2ih4tx7e4a76grwfa","html":"\u003ch2 id=\"blk-1\">Agentelic\u003c/h2>\n\u003cp>The engineering discipline between a demo and production. Build against a \u003ca href=\"#/specprompt\" data-link>SpecPrompt\u003c/a> spec, test deterministically with every tool call mocked, deploy with staged rollout — onto a governed runtime.\u003c/p>","text":"Agentelic The engineering discipline between a demo and production. Build against a SpecPrompt spec, test deterministically with every tool call mocked, deploy with staged rollout — onto a governed runtime.","edges":[{"pred":"builds from","to":"specprompt","href":null,"name":"SpecPrompt"}],"back":[{"from":"fleetprompt","name":"FleetPrompt","pred":"distributes"}]},{"id":"fleetprompt","name":"FleetPrompt","mark":"📦","os":"marketplace","status":"draft","layer":"annex","tagline":"The open marketplace where spec-verified, trust-scored agents are published and installed.","cid":"bagaaieraq5siru454m4fevixx4ruhp4m77hzfl3hwrzjkzl5lvfdd5cdczqa","html":"\u003ch2 id=\"blk-1\">FleetPrompt\u003c/h2>\n\u003cp>npm for AI agents: every published agent carries a machine-readable manifest declaring capabilities, permissions, dependencies, and the spec it was built against. Trust is computed from tests, usage, and audits — earned, not declared.\u003c/p>","text":"FleetPrompt npm for AI agents: every published agent carries a machine-readable manifest declaring capabilities, permissions, dependencies, and the spec it was built against. Trust is computed from tests, usage, and audits — earned, not declared.","edges":[{"pred":"distributes","to":"agentelic","href":null,"na d API. The tiered quota is a real resource ledger — the call past your limit isn’t rejected, it’s infeasible, with a certificate explaining the overage.","edges":[{"pred":"data for","to":"geofleetic","href":null,"name":"GeoFleetic"}],"back":[{"from":"geofleetic","name":"GeoFleetic","pred":"data from"}]}]}</script>
<script>// shell.js — client renderer. Reads the baked model, routes on hash, renders the Runefort
// floor (home) and the per-doc reading view with its typed-edge neighborhood + backlinks.
(function(){
"use strict";
const M = JSON.parse(document.getElementById('model').textContent);
const byId = Object.fromEntries(M.docs.map(d=>[d.id,d]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

const BANDS = [
  {key:'protocol', title:'three-protocol stack'},
  {key:'faculty',  title:'capability primitives'},
  {key:'provider', title:'reference providers'},
  {key:'substrate',title:'document substrate · this site runs on these'},
  {key:'annex',    title:'product ecosystem'},
];
const inBand = k => M.docs.filter(d=>d.layer===k);
const ST = s => ({live:'live',alpha:'alpha',spec:'spec',draft:'draft'}[s]||s);

function bar(){
  return `<div class="bar">
    <div class="mk" data-home>[<b>&</b>] ${esc(M.brand.toUpperCase())}</div>
    <div class="search">
      <input id="q" placeholder="search the stack…" autocomplete="off" spellcheck="false">
      <div class="results" id="res" style="display:none"></div>
    </div>
    <div class="chip">box-and-box <b>${esc(M.facts['kernel.version'])}</b></div>
    <div class="chip">${esc(M.facts['laws.count'])} laws</div>
  </div>`;
}

function room(d){
  return `<a class="room s-${d.status}" href="#/${d.id}">
    <div class="rk"><span class="mark">${d.mark}</span><span class="st s-${d.status}">${ST(d.status)}</span></div>
    <div class="rn">${esc(d.name)}</div><div class="ro">${esc(d.os)}</div>
    <div class="rt">${esc(d.tagline)}</div></a>`;
}

function home(){
  const ring0 = inBand('ring0');
  const kernel = byId['box-and-box'];
  const bands = BANDS.map(b=>{
    const ds = inBand(b.key); if(!ds.length) return '';
    return `<div class="band b-${b.key}"><div class="band-h">${esc(b.title)}</div>
      <div class="rooms">${ds.map(room).join('')}</div></div>`;
  }).join('');
  return `${bar()}<div class="wrap">
    <div class="hero">
      <div class="eyebrow">${esc(M.brand)} · open research into machine cognition</div>
      <h1>The stack, as a place you can walk.</h1>
      <p>Documentation for an ecosystem of agent protocols — composition, governance, memory,
      time, space, and measurement. Every page is a BendScript document; this floor is a Runefort
      layout. Pick a room.</p>
      <div class="legend">
        <span><i class="dot d-live"></i> live · on npm</span>
        <span><i class="dot d-alpha"></i> alpha</span>
        <span><i class="dot d-spec"></i> spec-complete</span>
        <span><i class="dot d-draft"></i> draft</span>
      </div>
    </div>
    <div class="floor">${bands}</div>
    <div class="ring0"><div class="band-h">ring 0 · the foundation everything runs on</div>
      <div class="slab">
        <span class="mark">${kernel.mark}</span>
        <div class="meta"><div class="ro">${esc(kernel.os)}</div><div class="rn">${esc(kernel.name)}</div>
          <div class="rt">${esc(kernel.tagline)}</div></div>
        <a class="go" href="#/box-and-box">read the kernel docs →</a>
      </div>
    </div>
    <div class="foot">© ${esc(M.brand)} · authored by ${esc(M.author)}.
      <span class="mono">${M.docs.length} documents · every page content-addressed (CIDv1).</span></div>
  </div>`;
}

function navRail(active){
  const group=(title,keys)=>{const ds=M.docs.filter(d=>keys.includes(d.layer));if(!ds.length)return'';
    return `<div class="gh">${title}</div>`+ds.map(d=>
      `<a href="#/${d.id}" class="${d.id===active?'on':''}"><span class="nm">${d.mark}</span>${esc(d.name)}</a>`).join('');};
  return `<div class="rail nav"><div class="rh">the stack</div>
    ${group('governance',['ring0'])}
    ${group('protocols',['protocol'])}
    ${group('primitives',['faculty'])}
    ${group('providers',['provider'])}
    ${group('substrate',['substrate'])}
    ${group('ecosystem',['annex'])}
  </div>`;
}

function edgeRail(d){
  const out = d.edges.length ? `<div class="ecard"><div class="et">this page →</div>${
    d.edges.map(e=>{const inner = e.href
      ? `<a href="${esc(e.href)}" target="_blank" rel="noopener">${esc(e.name)}</a>`
      : `<a href="#/${e.to}">${esc(e.name)}</a>`;
      return `<div class="edge"><span class="pred">${esc(e.pred)}</span>${inner}</div>`;}).join('')}</div>`:'';
  const inb = d.back.length ? `<div class="ecard"><div class="et">← referenced by</div>${
    d.back.map(b=>`<div class="edge"><span class="pred in">${esc(b.pred)}</span><a href="#/${b.from}">${esc(b.name)}</a></div>`).join('')}</div>`:'';
  const cid = `<div class="ecard"><div class="et">content id · CIDv1</div><div class="cidbox">
    <span class="lab">tamper-evident · BendScript</span>${esc(d.cid)}</div></div>`;
  return `<div class="rail edges"><div class="rh">graph neighborhood</div>${out}${inb}${cid}</div>`;
}

function doc(id){
  const d = byId[id]; if(!d) return home();
  return `${bar()}<div class="wrap"><div class="doc">
    ${navRail(id)}
    <div class="read">
      <div class="crumbs"><a href="#/" data-home>floor</a><span class="sep">/</span>${esc(d.name)}</div>
      <div class="metaline"><span class="st s-${d.status}" style="color:var(--${d.status})">${ST(d.status)}</span>
        <span class="os">${esc(d.os)}</span></div>
      ${d.html}
      <div class="foot"><a href="#/" data-home>← back to the floor</a></div>
    </div>
    ${edgeRail(d)}
  </div></div>`;
}

// ---- search ----
function search(q){
  q=q.trim().toLowerCase(); const res=document.getElementById('res'); if(!res)return;
  if(!q){res.style.display='none';return;}
  const hits=M.docs.map(d=>{
    const hay=(d.name+' '+d.os+' '+d.tagline+' '+d.text).toLowerCase();
    let s=0; if(d.name.toLowerCase().includes(q))s+=10; if(d.tagline.toLowerCase().includes(q))s+=4;
    if(hay.includes(q))s+=1; return {d,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  if(!hits.length){res.innerHTML=`<a><span class="rt">no matches for “${esc(q)}”</span></a>`;res.style.display='block';return;}
  res.innerHTML=hits.map(({d})=>`<a href="#/${d.id}"><div class="rn">${d.mark} ${esc(d.name)}</div><div class="rt">${esc(d.tagline)}</div></a>`).join('');
  res.style.display='block';
}

function route(){
  const h=location.hash.replace(/^#\//,'');
  app.innerHTML = (h && byId[h]) ? doc(h) : home();
  window.scrollTo(0,0);
  const q=document.getElementById('q');
  if(q){ q.addEventListener('input',e=>search(e.target.value));
    q.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=document.querySelector('#res a[href]');if(a)location.hash=a.getAttribute('href');}}); }
  document.querySelectorAll('[data-home]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();location.hash='#/';}));
  document.addEventListener('click',e=>{const r=document.getElementById('res');
    if(r&&!e.target.closest('.search'))r.style.display='none';},{once:true});
  if(!reduced){const rooms=document.querySelectorAll('.room');
    rooms.forEach((r,i)=>{r.style.opacity=0;r.style.transform='translateY(8px)';
      setTimeout(()=>{r.style.transition='opacity .4s ease, transform .4s ease';r.style.opacity=1;r.style.transform='none';}, 30+i*22);});}
}
window.addEventListener('hashchange',route);
route();
})();
</script></body></html>
